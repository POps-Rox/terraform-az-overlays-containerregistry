name: "🔧 Terraform CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-fmt:
    name: "📐 Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: "✅ Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Validate every Terraform directory
        run: |
          set -uo pipefail
          # Every directory containing at least one .tf file - root module,
          # nested submodules, examples at any depth, tests, infrastructure.
          mapfile -t dirs < <(find . -type f -name '*.tf' \
            -not -path '*/.terraform/*' -not -path '*/.git/*' \
            -exec dirname {} \; | sort -u)
          echo "Discovered ${#dirs[@]} Terraform directories"
          fail=0; ok=0
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            if (cd "$d" && terraform init -backend=false -no-color >/dev/null && terraform validate -no-color); then
              ok=$((ok+1))
            else
              echo "::error file=$d::terraform validate failed in $d"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done
          echo "---------------------------------------------"
          echo "validated OK : $ok"
          echo "FAILED       : $fail"
          exit $((fail > 0 ? 1 : 0))

  tflint:
    name: "🔍 TFLint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.59.1"

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --format compact --minimum-failure-severity=error
